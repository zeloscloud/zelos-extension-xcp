name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: extractions/setup-just@v3

      - name: Verify uv.lock is in sync with pyproject.toml
        # CI runs on Linux only; a stale lock otherwise ships in the marketplace
        # package and fails at install on other platforms.
        run: uv lock --locked

      - name: Install dependencies
        run: just ci-install

      - name: Run linting
        run: just check

      - name: Cache XCPlite test slave
        id: xcplite
        uses: actions/cache@v4
        with:
          path: build/xcplite_slave/xcp_test_slave
          key: xcplite-slave-${{ runner.os }}-${{ hashFiles('tests/xcplite_slave/*') }}

      - name: Build XCPlite test slave
        if: steps.xcplite.outputs.cache-hit != 'true'
        run: just xcplite-slave

      - name: Run tests
        env:
          XCP_TEST_SLAVE: ${{ github.workspace }}/build/xcplite_slave/xcp_test_slave
        run: just test
