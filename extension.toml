name = "XCP"
version = "0.2.0"
description = "Measure ECU internals over XCP (ASAM MCD-1) on CAN, CAN-FD, UDP or TCP by A2L name. DAQ and polled signals trace as physical values with units. Measurement only: never writes ECU memory, switches pages or flashes. Demo ECU included."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-xcp"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["xcp", "a2l", "asam", "ecu", "measurement", "automotive", "mcd-1", "xcp on can", "xcp on ethernet", "xcp on udp", "xcp on tcp", "daq", "pyxcp", "epk", "ecu measurement", "socketcan", "pcan", "kvaser", "vector", "slcan"]
categories = ["Automotive", "Networking", "Industrial", "Embedded", "Diagnostics"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_xcp"]
