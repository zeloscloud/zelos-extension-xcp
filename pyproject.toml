[project]
name = "zelos-extension-xcp"
version = "0.1.0"
description = "XCP measurement extension for Zelos"
authors = [{ name = "zeloscloud", email = "info@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "xcp", "a2l", "ecu", "automotive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Standalone actions need the at-rest harness (`zelos_sdk.extensions.actions`),
    # which first ships in 0.0.11a1. Naming a prerelease lets a resolver pick one.
    "zelos-sdk>=0.0.12a1",
    "rich-click>=1.8.0",
    # CAN buses, discovery and codec. Vendored as a git submodule, see
    # [tool.uv.sources].
    "zelos-extension-can",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-xcp"
Repository = "https://github.com/zeloscloud/zelos-extension-xcp"
Issues = "https://github.com/zeloscloud/zelos-extension-xcp/issues"
Documentation = "https://docs.zeloscloud.io/extensions"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
    "jsonschema>=4.0.0",
    "tomli>=2.3.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.uv.sources]
zelos-extension-can = { path = "vendor/zelos-extension-can", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_xcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100
# Vendored code keeps its own lint and format.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
