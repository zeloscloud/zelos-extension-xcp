[project]
name = "zelos-extension-xcp"
version = "0.1.3"
description = "Measure ECU internals over XCP (ASAM MCD-1) on CAN, CAN-FD, UDP or TCP by A2L name. DAQ and polled signals trace as physical values with units. Measurement only: never writes ECU memory, switches pages or flashes. Demo ECU included."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "xcp", "a2l", "ecu", "automotive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "rich-click>=1.8.0",
    # XCP master. Pinned exactly: `compat.py` patches this version's defects.
    "pyxcp==0.29.18",
    # A2L reader (`zelos_can.a2l`) and CAN bus runtime (`zelos_can.bus`).
    "zelos-can[python-can]>=0.0.11a13",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-xcp"
Repository = "https://github.com/zeloscloud/zelos-extension-xcp"
Issues = "https://github.com/zeloscloud/zelos-extension-xcp/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_xcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]
